{% extends "base.html" %}

{% block title %}Password Changed Successfully{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card shadow-sm text-center p-4 mt-4">
            <div class="card-body">
                <div class="text-success mb-3">
                    <i class="bi bi-shield-check display-3"></i>
                </div>
                <h4 class="fw-bold mb-2">Password Updated!</h4>
                <p class="text-muted">Your account password has been updated securely. You can now continue using the system.</p>
                <div class="mt-4">
                    <a href="{% url 'users:profile' %}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i> Return to Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
