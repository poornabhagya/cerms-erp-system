# ==============================================================================
# Construction Equipment Rental Management System (CERMS)
# High-Performance Nginx Reverse Proxy & Edge Gateway Configuration
# Reference: docs/05_DEVOPS_AND_CLOUD.md, docs/11_SECURITY_AND_AUTHENTICATION.md,
#            docs/21_DOCKER_AND_LOCAL_DEVELOPMENT.md
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Upstream Cluster (Django / Gunicorn Application Container)
# ------------------------------------------------------------------------------
upstream cerms_upstream {
    server cerms_web:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. AWS CloudFront / Edge Protocol Resolution Map
# Determines whether the downstream request was initiated via HTTPS
# ------------------------------------------------------------------------------
map $http_cloudfront_forwarded_proto $cf_proto {
    default $http_cloudfront_forwarded_proto;
    ''      $http_x_forwarded_proto;
}

map $cf_proto $proxy_x_forwarded_proto {
    default $cf_proto;
    ''      $scheme;
}

# ------------------------------------------------------------------------------
# 3. HTTP Server (Port 80) - Edge Origin & Redirect Handler
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security: Hide Nginx version from response headers
    server_tokens off;

    # Payload limits (Handles equipment inspection photos, telemetry data, PDF contracts)
    client_max_body_size 50M;

    # Gzip Compression for text-based payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers (OWASP Standards - docs/11_SECURITY_AND_AUTHENTICATION.md)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # AWS CloudFront / ALB / Docker Health Check Endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static Assets Delivery (Volume mounted from static_data)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # User-Uploaded Media Delivery (Volume mounted from media_data)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Primary Application Routing (Gunicorn Reverse Proxy)
    location / {
        proxy_pass http://cerms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Edge Routing & Client Information Propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy Timeout Configuration
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

