# ==============================================================================
# Construction Equipment Rental Management System (CERMS)
# Docker Compose Orchestration (Local & Cloud Parity Stack)
# Reference: docs/05_DEVOPS_AND_CLOUD.md, docs/21_DOCKER_AND_LOCAL_DEVELOPMENT.md
# ==============================================================================

version: "3.8"

services:
  # 1. Database Service (MariaDB 10.11 LTS)
  mariadb:
    image: mariadb:10.11
    container_name: cerms_mariadb
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=100
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - cerms_net

  # 2. Redis Message Broker & Cache Service (Redis 7.2 Alpine)
  redis:
    image: redis:7.2-alpine
    container_name: cerms_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - cerms_net

  # 3. Backend Web Service (Django + Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerms_web
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    env_file: .env
    environment:
      - DB_HOST=mariadb
    command: gunicorn cerms_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --worker-class gthread --timeout 60 --max-requests 1000 --max-requests-jitter 100
    volumes:
      - static_data:/app/collected_static
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 1200M
    networks:
      - cerms_net

  # 4. Celery Asynchronous Background Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerms_celery
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    env_file: .env
    environment:
      - DB_HOST=mariadb
    command: celery -A cerms_project worker -l INFO --concurrency=2 --max-memory-per-child=200000
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 600M
    networks:
      - cerms_net

  # 5. Nginx Reverse Proxy Service (Edge Routing / Static & Media Delivery)
  nginx:
    image: nginx:1.25-alpine
    container_name: cerms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 150M
    networks:
      - cerms_net

# Named Persistent Volumes
volumes:
  mariadb_data:
  static_data:
  media_data:

# Isolated Custom Bridge Network
networks:
  cerms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16