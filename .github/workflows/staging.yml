name: CERMS CI/CD - Staging Deployment & Automated Smoke Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "**.md"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cerms-web-repo
  ROLE_TO_ASSUME: arn:aws:iam::804372444724:role/cerms-github-actions-deploy-role
  STAGING_INSTANCE_ID: i-0cb762fcdb76a4720

jobs:
  test:
    name: Code Validation & Quality Checks
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: cerms_db
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libmariadb-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System & Model Checks
        env:
          DJANGO_SETTINGS_MODULE: cerms_project.settings.aws
          DB_HOST: 127.0.0.1
          DB_NAME: cerms_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_PORT: "3306"
          USE_CELERY: "False"
          USE_S3: "False"
          SECRET_KEY: "ci-test-secret-key-cerms"
        run: |
          python manage.py check

  build-and-push:
    name: Build & Push Container to Amazon ECR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (Passwordless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging
            ${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  deploy-staging-and-test:
    name: SSM Bastionless Deploy & Staging Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC (Passwordless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger SSM Deployment and Automated Smoke Test
        id: run-smoke-test
        run: |
          echo "Deploying update to Staging Host (${{ env.STAGING_INSTANCE_ID }})..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.STAGING_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CERMS Staging Auto-Deploy & Smoke Test: ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "mkdir -p /opt/cerms",
              "cd /opt/cerms",
              "if [ ! -d .git ]; then git clone https://github.com/${{ github.repository }}.git . ; fi",
              "git config --system --add safe.directory /opt/cerms || true",
              "git fetch origin main",
              "git reset --hard origin/main",
              "chmod +x ./scripts/deploy_staging.sh",
              "./scripts/deploy_staging.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched with ID: $COMMAND_ID (Timeout: 600 seconds)"

          echo "Polling SSM Command execution status (up to 10 minutes)..."
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.STAGING_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")

            echo "  [Poll $i/60 - Elapsed: $((i*10))s] Status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi
            sleep 10
          done

          # Retrieve complete invocation result as structured JSON
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.STAGING_INSTANCE_ID }}" \
            --output json > ssm_invocation.json || true

          python3 - << 'EOF'
          import json, sys, re, os

          try:
              with open('ssm_invocation.json', 'r') as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Warning: Could not parse ssm_invocation.json: {e}")
              data = {}

          status = data.get('Status', 'Unknown')
          status_details = data.get('StatusDetails', 'Unknown')
          response_code = data.get('ResponseCode', 'Unknown')
          stdout = data.get('StandardOutputContent', '')
          stderr = data.get('StandardErrorContent', '')

          print("\n" + "=" * 70)
          print(f"=== SSM EXECUTION RESULT: {status} (Code: {response_code}) ===")
          print(f"Status Details: {status_details}")
          print("=" * 70)

          print("\n--- STANDARD OUTPUT CONTENT ---")
          if stdout.strip():
              print(stdout)
          else:
              print("(No Standard Output content recorded)")

          print("\n--- STANDARD ERROR CONTENT ---")
          if stderr.strip():
              print(stderr)
          else:
              print("(No Standard Error content recorded)")
          print("=" * 70 + "\n")

          # Extract smoke test JSON if present
          match = re.search(r'\{[\s\S]*"total_tested"[\s\S]*\}', stdout)
          if match:
              try:
                  smoke_data = json.loads(match.group(0))
                  with open('staging_smoke_summary.json', 'w') as f:
                      json.dump(smoke_data, f, indent=2)
              except Exception:
                  with open('staging_smoke_summary.json', 'w') as f:
                      f.write(match.group(0))
          else:
              with open('staging_smoke_summary.json', 'w') as f:
                  json.dump({
                      'total_tested': 0,
                      'success_count': 0,
                      'protected_count': 0,
                      'crashes': 1 if status != 'Success' else 0,
                      'failed_routes': [{'url': 'Staging SSM Command Execution', 'status_code': str(response_code), 'error': (stderr.strip() or stdout.strip() or str(status_details))[-300:]}] if status != 'Success' else [],
                      'status': 'PASSED' if status == 'Success' else 'FAILED'
                  }, f, indent=2)

          if status != "Success":
              print(f"::error title=Staging Deployment Failed::SSM execution returned status: {status} (Exit Code: {response_code})")
              sys.exit(1)
          EOF

      - name: Parse Metrics, Emit Annotations and Generate Summary
        if: always()
        run: |
          python3 - << 'EOF'
          import json, os, sys

          try:
              with open('staging_smoke_summary.json', 'r') as f:
                  data = json.load(f)
          except Exception:
              data = {'total_tested': 'N/A', 'success_count': 'N/A', 'protected_count': 'N/A', 'crashes': 0, 'failed_routes': [], 'status': 'PASSED'}

          total = data.get('total_tested', 0)
          passed = data.get('success_count', 0)
          protected = data.get('protected_count', 0)
          crashes = data.get('crashes', 0)
          failed = data.get('failed_routes', [])
          status = "PASSED" if crashes == 0 else "FAILED"

          # 1. Emit GitHub Actions Workflow Annotations
          for item in failed:
              url = item.get('url', 'Unknown')
              err = item.get('error', 'Error 500')
              print(f"::error title=Route Crash Detected on CERMS Staging::URL: {url} | Details: {err}")

          # 2. Build Markdown Summary Table
          badge = "✅ ZERO DEFECTS" if crashes == 0 else f"❌ {crashes} CRASHES DETECTED"
          verdict = "✅ READY FOR QA" if crashes == 0 else "❌ STAGING DEPLOYMENT FAILED"

          error_section = ""
          if failed:
              error_section = "\n\n### ⚠️ Failed Routes Breakdown\n\n| Route | Status Code | Error Message |\n| :--- | :--- | :--- |\n"
              for item in failed:
                  error_section += f"| `{item.get('url')}` | `{item.get('status_code')}` | `{item.get('error')}` |\n"

          summary = f"""### 🧪 CERMS Staging Automated Smoke Test Report

          | Metric | Value | Status |
          | :--- | :--- | :--- |
          | **Target Environment** | Staging Node (`10.10.2.0/24`) | Active |
          | **Commit SHA** | `{os.environ.get('GITHUB_SHA')}` | Tested |
          | **Total Static Routes** | `{total}` | Audited |
          | **Accessible (200 OK)** | `{passed}` | Operational |
          | **RBAC Protected** | `{protected}` | Secured |
          | **Crash / 500 Errors** | `{crashes}` | {badge} |
          | **Gatekeeping Verdict** | `{status}` | {verdict} |
          {error_section}
          """

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          EOF

      - name: Upload Smoke Test Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-summary-${{ github.sha }}
          path: staging_smoke_summary.json

      - name: Send Email Deployment & Smoke Test Alert
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[CI/CD Staging Alert] Commit ${{ github.sha }} - Status:${{ job.status }}"
          to: ${{ secrets.ALERT_RECIPIENTS }}
          from: "CERMS CI/CD System <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h2>CERMS - Hardware Renting System - Staging Smoke Test Report</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Author:</strong> ${{ github.actor }}</p>
            <p><strong>Environment:</strong> AWS Staging (10.0.2.0/24)</p>
            <p><strong>Execution Status:</strong> ${{ job.status }}</p>
            <hr/>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Click here to view full GitHub Actions Run & Error Breakdown</a></p>


