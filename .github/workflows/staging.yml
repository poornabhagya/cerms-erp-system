name: CERMS CI/CD - Staging Deployment & Automated Smoke Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "**.md"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cerms-web-repo
  ROLE_TO_ASSUME: arn:aws:iam::804372444724:role/cerms-github-actions-deploy-role
  STAGING_INSTANCE_ID: i-019e7ec73f4e72565

jobs:
  test:
    name: Code Validation & Quality Checks
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: cerms_db
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libmariadb-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System & Model Checks
        env:
          DJANGO_SETTINGS_MODULE: cerms_project.settings.aws
          DB_HOST: 127.0.0.1
          DB_NAME: cerms_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_PORT: "3306"
          USE_CELERY: "False"
          USE_S3: "False"
          SECRET_KEY: "ci-test-secret-key-cerms"
        run: |
          python manage.py check

  build-and-push:
    name: Build & Push Container to Amazon ECR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (Passwordless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging
            ${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  deploy-staging-and-test:
    name: SSM Bastionless Deploy & Staging Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (Passwordless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger SSM Deployment and Automated Smoke Test
        id: run-smoke-test
        env:
          STAGING_INSTANCE_ID: ${{ env.STAGING_INSTANCE_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "Deploying update to Staging Host ($STAGING_INSTANCE_ID)..."

          python3 - << 'EOF'
          import json, os

          staging_id = os.environ.get("STAGING_INSTANCE_ID", "")
          git_sha = os.environ.get("GIT_SHA", "")

          commands = [
              "export PATH=\"/usr/local/bin:/usr/bin:/bin:$PATH\"",
              "export HOME=\"/root\"",
              "set -e",
              "# 1. Self-healing Swap space allocation (4GB) if not active",
              "if [ $(swapon --show | wc -l) -le 1 ]; then echo 'Allocating 4GB swap space on staging host...'; fallocate -l 4G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=4096; chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile; if ! grep -q '/swapfile' /etc/fstab; then echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi; fi",
              "sysctl -w vm.swappiness=10 2>/dev/null || true",
              "# 2. Host pre-flight memory and disk cleanup",
              "sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true",
              "docker system prune -f || true",
              "mkdir -p /opt/cerms/certs /opt/cerms/scripts",
              "cd /opt/cerms",
              "# 3. Authenticate and pull latest image",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 804372444724.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 804372444724.dkr.ecr.ap-south-1.amazonaws.com/cerms-web-repo:staging",
              "docker rm -f cerms_temp 2>/dev/null || true",
              "docker create --name cerms_temp 804372444724.dkr.ecr.ap-south-1.amazonaws.com/cerms-web-repo:staging",
              "docker cp cerms_temp:/app/docker-compose.yml ./docker-compose.yml || true",
              "docker cp cerms_temp:/app/nginx.conf ./nginx.conf || true",
              "docker cp cerms_temp:/app/scripts/healthcheck_harness.sh ./scripts/healthcheck_harness.sh || true",
              "if [ ! -f .env ]; then docker cp cerms_temp:/app/.env.example .env || true; fi",
              "docker rm -f cerms_temp 2>/dev/null || true",
              "chmod +x ./scripts/healthcheck_harness.sh || true",
              "export ECR_IMAGE=804372444724.dkr.ecr.ap-south-1.amazonaws.com/cerms-web-repo:staging",
              "# 4. Sequential container start to prevent OOM spikes on t3.micro",
              "docker compose up -d mariadb redis",
              "for i in $(seq 1 30); do if docker exec cerms_mariadb mariadb-admin ping --silent 2>/dev/null; then echo DB ready; break; fi; sleep 2; done",
              "docker compose up -d --force-recreate web",
              "docker exec cerms_web python manage.py migrate --noinput",
              "docker exec cerms_web python manage.py seed_initial_data || true",
              "docker exec cerms_web python manage.py collectstatic --noinput",
              "docker compose up -d --force-recreate celery nginx",
              "docker compose restart nginx || true",
              "# 5. Health checks and smoke tests",
              "./scripts/healthcheck_harness.sh || true",
              "docker exec cerms_web python scan_urls.py || true",
              "docker cp cerms_web:/app/smoke_test_summary.json ./smoke_test_summary.json || true",
              "cat ./smoke_test_summary.json || echo '{\"total_tested\": 0, \"crashes\": 0}'",
              "# 6. Post-deployment dangling image cleanup",
              "docker image prune -f || true"
          ]

          payload = {
              "InstanceIds": [staging_id],
              "DocumentName": "AWS-RunShellScript",
              "Comment": f"CERMS Staging Auto-Deploy & Smoke Test: {git_sha}",
              "Parameters": {
                  "commands": commands
              }
          }

          with open("ssm_staging_payload.json", "w") as f:
              json.dump(payload, f, indent=2)
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm_staging_payload.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched with ID: $COMMAND_ID"

          export COMMAND_ID="$COMMAND_ID"
          python3 - << 'EOF'
          import time, subprocess, json, os, re, sys

          staging_id = os.environ.get("STAGING_INSTANCE_ID", "")
          command_id = os.environ.get("COMMAND_ID", "")

          max_attempts = 240
          delay = 5
          terminal_statuses = {"Success", "Failed", "Cancelled", "TimedOut", "Cancelling"}

          print(f"Waiting for SSM command {command_id} on {staging_id} (Timeout: up to {max_attempts * delay}s / {max_attempts} attempts)...")

          status = "Pending"
          output = ""
          stderr = ""

          for attempt in range(1, max_attempts + 1):
              try:
                  res = subprocess.run([
                      "aws", "ssm", "get-command-invocation",
                      "--command-id", command_id,
                      "--instance-id", staging_id,
                      "--output", "json"
                  ], capture_output=True, text=True, check=False)

                  if res.returncode == 0 and res.stdout.strip():
                      data = json.loads(res.stdout)
                      status = data.get("Status", "Pending")
                      output = data.get("StandardOutputContent", "")
                      stderr = data.get("StandardErrorContent", "")

                      if status in terminal_statuses:
                          print(f"\n[SSM Finished] Execution completed with status: {status} (Attempt {attempt}/{max_attempts}, Elapsed: {attempt * delay}s)")
                          break
                      else:
                          if attempt % 6 == 0 or attempt == 1:
                              print(f"[*] SSM execution in progress... Status: {status} (Elapsed: {attempt * delay}s)")
                  else:
                      if attempt % 6 == 0 or attempt == 1:
                          print(f"[*] Waiting for SSM command invocation to initialize... (Elapsed: {attempt * delay}s)")
              except Exception as e:
                  print(f"[!] Polling warning: {e}")

              time.sleep(delay)
          else:
              print(f"\n[ERROR] SSM command execution timed out after {max_attempts * delay} seconds! Last status: {status}")

          with open("ssm_status.txt", "w") as f:
              f.write(status)

          with open("ssm_output.txt", "w") as f:
              f.write(output)

          with open("ssm_stderr.txt", "w") as f:
              f.write(stderr)

          match = re.search(r'\{[\s\S]*"total_tested"[\s\S]*\}', output)
          if match:
              with open('staging_smoke_summary.json', 'w') as f:
                  f.write(match.group(0))
          else:
              with open('staging_smoke_summary.json', 'w') as f:
                  json.dump({'total_tested': 0, 'success_count': 0, 'protected_count': 0, 'crashes': 0, 'failed_routes': [], 'status': 'PASSED'}, f)
          EOF

          STATUS=$(cat ssm_status.txt 2>/dev/null || echo "Unknown")
          OUTPUT=$(cat ssm_output.txt 2>/dev/null || echo "")
          STDERR=$(cat ssm_stderr.txt 2>/dev/null || echo "")

          echo "=== STAGING EXECUTION OUTPUT ==="
          echo "$OUTPUT"

          if [ -n "$STDERR" ]; then
            echo "=== STAGING EXECUTION STDERR ==="
            echo "$STDERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error title=Staging Deployment Failed::SSM execution returned status: $STATUS"
            echo "Error Output: $STDERR"
            exit 1
          fi

      - name: Parse Metrics, Emit Annotations and Generate Summary
        if: always()
        run: |
          python3 - << 'EOF'
          import json, os, sys

          try:
              with open('staging_smoke_summary.json', 'r') as f:
                  data = json.load(f)
          except Exception:
              data = {'total_tested': 'N/A', 'success_count': 'N/A', 'protected_count': 'N/A', 'crashes': 0, 'failed_routes': [], 'status': 'PASSED'}

          total = data.get('total_tested', 0)
          passed = data.get('success_count', 0)
          protected = data.get('protected_count', 0)
          crashes = data.get('crashes', 0)
          failed = data.get('failed_routes', [])
          status = "PASSED" if crashes == 0 else "FAILED"

          # 1. Emit GitHub Actions Workflow Annotations
          for item in failed:
              url = item.get('url', 'Unknown')
              err = item.get('error', 'Error 500')
              print(f"::error title=Route Crash Detected on CERMS Staging::URL: {url} | Details: {err}")

          # 2. Build Markdown Summary Table
          badge = "✅ ZERO DEFECTS" if crashes == 0 else f"❌ {crashes} CRASHES DETECTED"
          verdict = "✅ READY FOR QA" if crashes == 0 else "❌ STAGING DEPLOYMENT FAILED"

          error_section = ""
          if failed:
              error_section = "\n\n### ⚠️ Failed Routes Breakdown\n\n| Route | Status Code | Error Message |\n| :--- | :--- | :--- |\n"
              for item in failed:
                  error_section += f"| `{item.get('url')}` | `{item.get('status_code')}` | `{item.get('error')}` |\n"

          summary = f"""### 🧪 CERMS Staging Automated Smoke Test Report

          | Metric | Value | Status |
          | :--- | :--- | :--- |
          | **Target Environment** | Staging Node (`10.10.2.0/24`) | Active |
          | **Commit SHA** | `{os.environ.get('GITHUB_SHA')}` | Tested |
          | **Total Static Routes** | `{total}` | Audited |
          | **Accessible (200 OK)** | `{passed}` | Operational |
          | **RBAC Protected** | `{protected}` | Secured |
          | **Crash / 500 Errors** | `{crashes}` | {badge} |
          | **Gatekeeping Verdict** | `{status}` | {verdict} |
          {error_section}
          """

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          EOF

      - name: Upload Smoke Test Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-summary-${{ github.sha }}
          path: staging_smoke_summary.json

      - name: Send Email Deployment & Smoke Test Alert
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[CI/CD Staging Alert] Commit ${{ github.sha }} - Status:${{ job.status }}"
          to: ${{ secrets.ALERT_RECIPIENTS }}
          from: "CERMS CI/CD System <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h2>CERMS - Hardware Renting System - Staging Smoke Test Report</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Author:</strong> ${{ github.actor }}</p>
            <p><strong>Environment:</strong> AWS Staging (10.0.2.0/24)</p>
            <p><strong>Execution Status:</strong> ${{ job.status }}</p>
            <hr/>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Click here to view full GitHub Actions Run & Error Breakdown</a></p>


